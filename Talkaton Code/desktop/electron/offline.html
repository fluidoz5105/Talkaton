<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talkaton — Connection needed</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f7f7f8; background: radial-gradient(circle at 50% 20%, #f4444924, transparent 35%), #09090b; }
    main { width: min(100%, 460px); padding: 42px; border: 1px solid #303036; border-radius: 22px; background: #151518; text-align: center; box-shadow: 0 30px 100px #0008; }
    .mark { display: grid; width: 48px; height: 48px; margin: auto; place-items: center; border-radius: 14px; background: #f44449; font-size: 22px; font-weight: 900; }
    h1 { margin: 25px 0 10px; font-size: 32px; letter-spacing: -.045em; }
    p { margin: 0; color: #a3a3ab; line-height: 1.6; }
    a { display: block; margin-top: 28px; padding: 15px; border-radius: 12px; color: #080809; background: #f7f7f8; text-decoration: none; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">T</span>
    <h1>Talkaton is offline</h1>
    <p>Check your connection, then try loading your workspace again.</p>
    <a href="https://talkaton.org/chat?desktop=1">Try again</a>
  </main>
</body>
</html>
