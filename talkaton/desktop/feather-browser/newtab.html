<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; form-action https://www.google.com; base-uri 'none'">
    <title>New tab</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; overflow: hidden; color: #17201d; background: #fbfcfb; }
      main { width: min(620px, calc(100vw - 48px)); margin-top: -9vh; text-align: center; }
      .mark { display: inline-grid; width: 56px; height: 56px; place-items: center; margin-bottom: 18px; border-radius: 18px; color: #177b59; background: #daf0e6; box-shadow: inset 0 0 0 1px #c7e6d9; }
      svg { width: 30px; fill: currentColor; }
      h1 { margin: 0 0 7px; font-size: 30px; font-weight: 650; letter-spacing: -.03em; }
      p { margin: 0 0 28px; color: #71807a; font-size: 14px; }
      form { display: flex; align-items: center; height: 52px; border: 1px solid #dce2df; border-radius: 16px; background: white; box-shadow: 0 12px 38px rgba(28,48,39,.08); }
      form:focus-within { border-color: #70b89d; box-shadow: 0 0 0 4px #e0f2ea, 0 16px 44px rgba(28,48,39,.1); }
      input { width: 100%; height: 100%; padding: 0 18px; border: 0; outline: 0; color: #17201d; background: transparent; font: inherit; font-size: 15px; }
      button { margin-right: 7px; padding: 10px 15px; border: 0; border-radius: 11px; color: white; background: #177b59; font: inherit; font-size: 13px; font-weight: 600; }
      .privacy { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 18px; color: #84908a; font-size: 11.5px; }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #58a98a; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M25.8 4.8C18.3 5 11.3 8.2 7.6 14.1c-2.1 3.4-2.3 7-.5 10.4 2.8-5 7-8.8 12.7-11.4-5 3.4-8.6 7.7-10.9 12.9h3.3c2.5-4.4 6.3-7.8 11.3-10.3-2 2-3.7 4.3-5 6.9 4.6-2.7 7.4-8.4 7.3-17.8Z"/></svg>
      </div>
      <h1>Browse lightly.</h1>
      <p>A focused Chromium browser without the extra furniture.</p>
      <form action="https://www.google.com/search" method="get">
        <input name="q" type="search" autofocus autocomplete="off" placeholder="Search the web" aria-label="Search the web">
        <button type="submit">Search</button>
      </form>
      <div class="privacy"><span class="dot"></span>Searches use Google by default</div>
    </main>
  </body>
</html>
